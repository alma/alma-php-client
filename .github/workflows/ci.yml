name: Continuous integration

on:
  workflow_dispatch: ~
  push:
    branches:
      - develop
      - main
      - feature/3.0
  pull_request:
    branches:
      - develop
      - main
      - feature/3.0

jobs:
  ci:
    name: Linting, tests and coverage
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        php:
          - "5.6"
          - "7.0"
          - "7.1"
          - "7.2"
          - "7.3"
          - "7.4"
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate

      # roave/security-advisories (@dev) conflicts with every PHPUnit version
      # installable on PHP < 7.2, making dependency resolution impossible there.
      # The advisory guard still runs on the modern PHP legs of the matrix.
      - name: Drop security advisories guard on legacy PHP
        if: contains(fromJson('["5.6", "7.0", "7.1"]'), matrix.php)
        run: composer remove --dev --no-update roave/security-advisories

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Ensure source code is linted
        run: composer exec phpcs -- src/

      - name: Remove uncompliant statements in legacy code
        if: contains(fromJson('["5.6", "7.0"]'), matrix.php)
        run: |
          # Replace string in files
          string=': void'
          grep -r -l "$string" tests/ | xargs sed -i "s/$string//g"

      - name: PHPUnit
        run: |
          case ${{ matrix.php }} in
            8.1|8.2|8.3 ) composer exec phpunit -- --configuration phpunit.ci.8.xml --coverage-xml ./.coverage;;
            *) composer exec phpunit -- --configuration phpunit.ci.xml --coverage-xml ./.coverage;;
          esac
        env:
          XDEBUG_MODE: coverage

      - name: PHPUnit threshold
        run: php ./phpunit-threshold.php
