# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, main]

  - repo: local
    hooks:
      - id: coding-standard-fixer
        name: Check PHP coding standards and fix
        language: system
        pass_filenames: false
        entry:  task lint:fix
        stages: [pre-commit]

      - id: coding-standard
        name: Check PHP coding standards
        language: system
        pass_filenames: false
        entry:  task lint
        stages: [pre-commit]

      - id: php-compatibility
        name: Check the PHP compatibility
        language: system
        pass_filenames: false
        entry:  task php-compatibility
        stages: [pre-commit]

  - repo: https://github.com/returntocorp/semgrep
    rev: v1.184.0
    hooks:
      - id: semgrep
        args:
          - --error
          - --config
          - semgrep/rules/
          - --metrics
          - "off"
          - --disable-version-check
          - --skip-unknown-extensions
        pass_filenames: false # Passing files explicitely override semgrepignore
